[versions]
agp = "9.5.0-alpha06"
kotlin = "2.4.20"
compose-multiplatform = "1.13.0-alpha01"
detekt = "2.0.0-alpha.6"
ktlint = "14.2.0"
spotlessVersion = "8.10.2"
kover = "0.9.9"
# NOTE: this `room` alias versions androidx.room3:room3-gradle-plugin — the Room 3.x KMP line,
# a DIFFERENT artifact from androidx.room (2.8.x) that consuming apps pin for runtime/compiler.
# They move independently; do not "align" them.
room = "3.1.0-alpha01"
ksp = "2.3.12"
kmpFlavors = "2.10.0"
googleServices = "4.5.0"
firebaseCrashlyticsPlugin = "3.0.8"
firebaseBom = "34.19.0"

dokka = "2.3.0-Beta"

[libraries]
# Gradle-plugin artifacts the convention plugins apply programmatically (compileOnly in convention/build.gradle.kts)
android-gradlePlugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }
kotlin-gradlePlugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
compose-gradlePlugin = { module = "org.jetbrains.compose:compose-gradle-plugin", version.ref = "compose-multiplatform" }
composeCompiler-gradlePlugin = { module = "org.jetbrains.kotlin:compose-compiler-gradle-plugin", version.ref = "kotlin" }
detekt-gradlePlugin = { module = "dev.detekt:detekt-gradle-plugin", version.ref = "detekt" }
ktlint-gradlePlugin = { module = "org.jlleitschuh.gradle:ktlint-gradle", version.ref = "ktlint" }
spotless-gradlePlugin = { module = "com.diffplug.spotless:spotless-plugin-gradle", version.ref = "spotlessVersion" }
kover-gradlePlugin = { module = "org.jetbrains.kotlinx:kover-gradle-plugin", version.ref = "kover" }
# Ruleset consumed by SharedDetektConventionPlugin via `detektPlugins` at consumer build time (not compileOnly).
# Detekt 2.x moved the ktlint-style formatting rules out of `detekt-formatting` (which does not
# exist in the 2.x line) into `detekt-rules-ktlint-wrapper`. Alias kept for consumer stability.
detekt-formatting = { module = "dev.detekt:detekt-rules-ktlint-wrapper", version.ref = "detekt" }
# Room 3 (KMP) + KSP + kmp-product-flavors gradle-plugin artifacts, compileOnly'd for the same
# ClassCastException-avoidance reason as the artifacts above.
room-gradlePlugin = { module = "androidx.room3:room3-gradle-plugin", version.ref = "room" }
ksp-gradlePlugin = { module = "com.google.devtools.ksp:com.google.devtools.ksp.gradle.plugin", version.ref = "ksp" }
kmpFlavors-gradlePlugin = { module = "io.github.mobilebytelabs.kmpflavors:flavor-plugin", version.ref = "kmpFlavors" }
# Firebase Gradle-plugin artifacts applied programmatically by SharedAndroidApplicationFirebaseConventionPlugin
# (compileOnly in convention/build.gradle.kts — same ClassCastException-avoidance reason as the artifacts above).
googleServices-gradlePlugin = { module = "com.google.gms:google-services", version.ref = "googleServices" }
firebaseCrashlytics-gradlePlugin = { module = "com.google.firebase:firebase-crashlytics-gradle", version.ref = "firebaseCrashlyticsPlugin" }
# Firebase runtime BOM + libraries wired by the firebase convention plugin. Looked up from the *consuming*
# project's own version catalog at apply-time (findLibrary(...).ifPresent {}, same pattern as
# SharedRoomConventionPlugin) — these entries document the coordinates/versions the family standardises on.
firebase-bom = { module = "com.google.firebase:firebase-bom", version.ref = "firebaseBom" }
firebase-analytics = { module = "com.google.firebase:firebase-analytics" }
firebase-crashlytics = { module = "com.google.firebase:firebase-crashlytics" }

[plugins]
# Detekt + ktlint applied to THIS build's own Kotlin (the convention plugins themselves), against
# the family standard in config/detekt/detekt.yml + .editorconfig. The `*-gradlePlugin` library
# entries above are compileOnly compile-time deps of the convention sources; these are the plugin
# markers that actually run the tools here. ktlint (not Spotless, not detekt's ktlint-wrapper
# ruleset) is the single owner of formatting and line length — see .editorconfig.
detekt = { id = "dev.detekt", version.ref = "detekt" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint" }
# API docs for the convention plugins — the most load-bearing, least documented code in the family.
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
