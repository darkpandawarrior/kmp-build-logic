# This build is normally consumed via includeBuild, where the CONSUMING root build's
# gradle.properties governs the daemon and these values are not read. Everything here applies
# to a standalone `./gradlew` run in this directory (publishing, CI, testing the convention
# plugins in isolation) — which is what this repo's own CI does on every push.

# Lets `clean` + rebuild restore compileKotlin/jar instead of recompiling.
# Measured 2026-09-21, `:convention:validatePlugins :convention:assemble` after `clean`:
# 4.9s -> 2.8s median of 3.
org.gradle.caching=true

# Gradle 9.8 prints a hint suggesting this on every run here. Stores with ZERO problems on this
# tree — no `problems=warn` on-ramp needed, so it stays at the default `fail`.
# Measured with caching also on: clean rebuild 4.9s -> 1.3s, no-op 1.9s -> 1.5s (median of 3).
org.gradle.configuration-cache=true

# These two are about daemon IDENTITY, not heap size — do not "tune" the numbers. Gradle and the
# Kotlin compiler reuse a daemon only when the JVM args match byte-for-byte, so these deliberately
# copy the fingerprint Candidai/Doori already use. Verified 2026-09-21: with both lines set, a
# standalone build here starts NO new Gradle daemon and NO new Kotlin daemon — it joins the fleet's.
# They only work as a pair: with jvmargs alone, the Kotlin daemon inherits -Xmx4g/1536m, matches
# nobody, and spawns its own ~500MB JVM — strictly worse than setting neither.
org.gradle.jvmargs=-Xmx4g -Xms1g -XX:MaxMetaspaceSize=1536m -XX:+UseParallelGC -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=2g

# Deliberately NOT set here:
#   org.gradle.parallel        — one subproject (:convention). Nothing to run in parallel.
#   configuration-cache.parallel — incubating, and there is no configuration worth splitting.
#   kotlin.incremental.native  — no Kotlin/Native targets in this build.
# The "incompatible with Gradle 10" banner this build emits is NOT from this repo. Re-confirmed
# 2026-09-22 with `./gradlew :convention:check --warning-mode=all -Dorg.gradle.deprecation.trace=true`:
# the ONLY deprecation reached is Configuration.setVisible(boolean), 17 frames from
# org.jetbrains.dokka.gradle and 2 from dev.detekt.gradle.plugin. It is scheduled for Gradle 11,
# not 10 — Gradle 9.8 prints the same generic banner for both horizons. Nothing in this repo's
# own scripts or convention plugins is on the list; the Gradle 10 removals that DO bite the
# family (`val x by creating`, `export(project(":x"))`) live in the app repos' build scripts.
